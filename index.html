<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 投资助手</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #007bff; --bg: #f4f7f6; --text: #333; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; padding: 20px; margin: 0; }
        .card { background: white; padding: 2rem; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); width: 100%; max-width: 420px; text-align: center; transition: all 0.3s; }
        h2, h3 { margin-top: 0; color: #1a1a1a; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }
        button { width: 100%; padding: 12px; margin: 8px 0; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 15px; transition: opacity 0.2s; }
        .btn-main { background: var(--primary); color: white; }
        .btn-sub { background: #6e6e73; color: white; }
        .btn-back { background: transparent; border: 1px solid #ddd; color: #666; }
        button:active { opacity: 0.8; }
        .list-container { margin: 15px 0; max-height: 300px; overflow-y: auto; border: 1px solid #eee; border-radius: 8px; }
        .list-item { padding: 15px; border-bottom: 1px solid #eee; text-align: left; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .list-item:hover { background: #f9f9f9; }
        .news-card { text-align: left; background: #f8f9fa; padding: 12px; border-radius: 8px; margin-bottom: 10px; border-left: 4px solid var(--primary); }
        .news-text { font-size: 14px; margin-bottom: 5px; line-height: 1.4; }
        .news-link { font-size: 12px; color: var(--primary); text-decoration: none; font-weight: bold; }
        #loader { font-size: 14px; color: #666; margin: 10px 0; min-height: 20px; }
    </style>
</head>
<body>

<div class="card" id="app">
    <div id="login-view">
        <h2>系统安全登录</h2>
        <input type="text" id="username" placeholder="用户名">
        <input type="password" id="password" placeholder="密码">
        <button class="btn-main" onclick="doLogin()">登录</button>
        <p id="login-msg" style="color: #d9534f; font-size: 13px;"></p>
    </div>
</div>

<script>
    // --- 配置区 ---
    const SUPABASE_URL = 'https://wtadkhlpdwhlbdjbaafc.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind0YWRraGxwZHdobGJkamJhYWZjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA1MzA0MDMsImV4cCI6MjA4NjEwNjQwM30.FIpa7AHUS8A7nh2dFxvNDJBIZugtPmz_o5NhBz-NgT0'; // 建议在环境变量中使用
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const app = document.getElementById('app');

    // --- 1. 登录逻辑 ---
    async function doLogin() {
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;
        const msg = document.getElementById('login-msg');
        
        try {
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user, pass })
            });
            const data = await res.json();
            if (data.success) {
                app.innerHTML = "<h2>🎉 登录成功</h2>";
                setTimeout(showMainMenu, 500);
            } else {
                msg.innerText = data.message || "登录失败";
            }
        } catch (e) {
            msg.innerText = "服务器连接异常";
        }
    }
   
    function showMainMenu() {
    app.innerHTML = `
        <h3>操作菜单</h3>
        <button class="btn-main" onclick="showEntryView()">📈 数据录入</button>
        <button class="btn-sub" onclick="showStockListView()">📖 数据读取</button>
        <hr style="border:0; border-top:1px solid #eee; margin:20px 0;">
        <div id="db-info" style="font-size:12px; color:#888;">正在加载存储状态...</div>
    `;
    updateDatabaseUsage(); // 切换到主菜单时更新用量
    }

    function showEntryView() {
        app.innerHTML = `
            <h3>数据录入</h3>
            <p style="font-size:12px; color:#666;">支持美股、港股、A股、新股 (如: NVDA, 0700.HK, SH.601398, SZ.000001, D05.SGX)</p>
            <input type="text" id="symbol-input" placeholder="输入股票代码">
            <button class="btn-main" id="submit-btn" onclick="handleEntrySubmit()">开始抓取总结</button>
            <div id="loader"></div>
            <button class="btn-back" onclick="showMainMenu()">返回主菜单</button>
        `;
    }

    async function handleEntrySubmit() {
        const symbol = document.getElementById('symbol-input').value.trim().toUpperCase();
        if (!symbol) return alert("请输入代码");
        
        const loader = document.getElementById('loader');
        const btn = document.getElementById('submit-btn');
        
        loader.innerText = "🚀 正在获取并分析新闻...";
        btn.disabled = true; // 防止重复点击

        try {
            const res = await fetch(`/api/fetch-news?symbol=${symbol}`);
            const data = await res.json();

            if (data.success) {
                let html = `<h4>录入结果 (${data.date})</h4>`;
                if (data.data && data.data.length > 0) {
                    data.data.forEach(item => {
                        html += `<div class="news-card"><div class="news-text">${item.text}</div></div>`;
                    });
                } else {
                    html += `<p style="color:#666;">📅 今日无重大新闻，仅记录日期。</p>`;
                }
                html += `<button class="btn-main" onclick="showEntryView()">继续录入</button>`;
                html += `<button class="btn-back" onclick="showMainMenu()">返回主菜单</button>`;
                app.innerHTML = html;
            } else {
                loader.innerText = "❌ 处理失败: " + (data.error || "未知错误");
                btn.disabled = false;
            }
        } catch (e) {
            loader.innerText = "❌ 网络请求失败，请检查 API 路由";
            btn.disabled = false;
        }
    }

    async function showStockListView() {
        app.innerHTML = "<h3>读取列表中...</h3>";
        const { data, error } = await supabaseClient.from('stock_news').select('stock_symbol');
        if (error) return (app.innerHTML = "读取失败");

        const symbols = [...new Set(data.map(i => i.stock_symbol))].sort();
        let html = `<h3>选择股票代码</h3><div class="list-container">`;
        symbols.forEach(s => {
            html += `<div class="list-item" onclick="showDateListView('${s}')"><span>${s}</span> <span>→</span></div>`;
        });
        html += `</div><button class="btn-back" onclick="showMainMenu()">返回主菜单</button>`;
        app.innerHTML = symbols.length ? html : "<h3>暂无数据</h3><button class='btn-back' onclick='showMainMenu()'>返回主菜单</button>";
    }

    async function showDateListView(symbol) {
        app.innerHTML = `<h3>${symbol} - 历史记录</h3>`;
        const { data, error } = await supabaseClient
            .from('stock_news').select('created_date').eq('stock_symbol', symbol).order('created_date', { ascending: false });

        let html = `<div class="list-container">`;
        data.forEach(row => {
            html += `<div class="list-item" onclick="showNewsDetail('${symbol}', '${row.created_date}')"><span>${row.created_date}</span> <span>👁️</span></div>`;
        });
        html += `</div><button class="btn-sub" onclick="showStockListView()">返回上一级</button>`;
        app.innerHTML += html;
    }

    async function showNewsDetail(symbol, date) {
        app.innerHTML = "<h3>加载中...</h3>";
        const { data } = await supabaseClient
            .from('stock_news').select('content').eq('stock_symbol', symbol).eq('created_date', date).single();

        let html = `<h3>${symbol} (${date})</h3>`;
        const items = JSON.parse(data.content);
        if (items && items.length > 0) {
            items.forEach(item => {
                html += `<div class="news-card"><div class="news-text">${item.text}</div><a href="${item.url}" target="_blank" class="news-link">阅读原文 →</a></div>`;
            });
        } else {
            html += `<p>无新闻详情</p>`;
        }
        html += `<button class="btn-sub" onclick="showDateListView('${symbol}')">返回上一级</button>`;
        app.innerHTML = html;
    }

    async function updateDatabaseUsage() {
    try {
        // 调用我们刚刚在 SQL Editor 创建的 RPC 函数
        const { data, error } = await supabaseClient.rpc('get_database_size');
        
        const infoDiv = document.getElementById('db-info');
        if (error) throw error;

        // 假设免费版限制是 500MB
        const limit = 500;
        const usage = data.toFixed(2);
        const percent = ((usage / limit) * 100).toFixed(1);

        infoDiv.innerHTML = `
            存储使用量: ${usage} MB / ${limit} MB (${percent}%)
            <div style="width:100%; background:#eee; height:4px; border-radius:2px; margin-top:5px;">
                <div style="width:${percent}%; background:${percent > 80 ? '#d9534f' : '#28a745'}; height:100%; border-radius:2px;"></div>
            </div>
        `;
    } catch (e) {
        console.error("无法获取容量信息:", e);
        document.getElementById('db-info').innerText = "容量信息获取失败";
    }
}
</script>
</body>
</html>
